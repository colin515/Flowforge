name: Publish both websites
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flowforge-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w @flowforge/web
      - uses: actions/checkout@v4
        with:
          ref: split-websites
          path: publish
      - name: Copy both built sites to the Pages branch
        run: |
          rm -rf publish/assets publish/marketplace
          cp -a apps/web/dist/. publish/
          cd publish
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish Flowforge websites from ${GITHUB_SHA}"
            git push origin HEAD:split-websites
          fi
