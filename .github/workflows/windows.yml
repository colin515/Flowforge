name: Windows build and release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci
      - run: npm run ocr:assets
      - name: Validate tagged release configuration
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-config.mjs
      - run: npm test
      - run: npm run build
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: npm run desktop -- build
      - uses: actions/upload-artifact@v4
        with:
          name: Flowforge-Windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
  release:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Flowforge-Windows-installer
          path: installer
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Flowforge v0.1.0
          draft: false
          generate_release_notes: true
          overwrite_files: true
          files: installer/*-setup.exe
