
[package]
name = "flowforge"
version = "0.4.1"
edition = "2021"
rust-version = "1.87"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.6.1"
screenshots = "0.8.10"
image = { version = "0.24", default-features = false, features = ["png"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
