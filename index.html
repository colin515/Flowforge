<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f5" />
    <script>
      try {
        const t =
          JSON.parse(localStorage.getItem("ff-theme")) ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch {}
    </script>
    <meta
      name="description"
      content="Flowforge — visual desktop automation, thoughtfully crafted for Windows."
    />
    <title>Flowforge — Automation, beautifully simple</title>
    <script type="module" crossorigin src="./assets/main-BgvTuPAb.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-eB0VCmf5.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
