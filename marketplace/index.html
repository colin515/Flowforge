<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../assets/flowforge-mark-v6jeSxfm.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      try {
        const t =
          JSON.parse(localStorage.getItem("ff-theme")) ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch {}
    </script>
    <meta
      name="description"
      content="Browse and download Flowforge macros from the community marketplace."
    />
    <title>Flowforge Marketplace — Community macros</title>
    <script type="module" crossorigin src="../assets/main-Dr_YixKT.js"></script>
    <link rel="stylesheet" crossorigin href="../assets/main-CCYirfjo.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
